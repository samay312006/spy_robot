<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Robot</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
        }
        h2 {
            text-align: center;
            margin: 10px 0;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 10px;
        }

        .video-section {
            flex: 1 1 auto;
            max-width: 640px;
            min-width: 300px;
        }
        #video {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #00bfff;
            background: #000;
            display: block;
        }

        .control-panel {
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #status {
            background: #222;
            padding: 10px;
            margin: 10px auto;
            max-width: 800px;
            text-align: left;
            font-size: 14px;
            height: 120px;
            overflow-y: auto;
            color: #0f0;
            border-radius: 5px;
            white-space: pre-wrap;
            clear: both;
        }

        #joystick-zone {
            width: 200px;
            height: 200px;
            position: relative;
            margin: 0 auto;
        }

        button {
            width: 160px;
            padding: 15px;
            font-size: 20px;
            background: #ff3333;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }
        button:active { background: #cc0000; }

        .patrol-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        input, textarea {
            padding: 5px;
            font-size: 16px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            width: 160px;
        }

        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .video-section { max-width: 90vw; }
            .control-panel {
                flex: 0 0 auto;
                width: 90vw;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <h2>SPY ROBOT LIVE</h2>

    <div class="main-container">
        <div class="video-section">
            <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="control-panel">
            <div id="joystick-zone"></div>
            <button onclick="sendCommand('s')">STOP</button>
            <div class="patrol-controls">
                <input id="patrolTimes" placeholder="08:00,18:00" />
                <button onclick="setSchedule()">Set Schedule</button>
                <textarea id="waypoints" rows="3">[{"cmd":"f","duration":2,"speed":80}]</textarea>
                <button onclick="loadWaypoints()">Load Waypoints</button>
                <button onclick="startManualPatrol()">Start Patrol Now</button>
            </div>
        </div>
    </div>

    <div id="status">Initializing...</div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
        // ========== CONFIGURATION ==========
        const broker = '5b5d1fc229d14745991d15a955fef7ca.s1.eu.hivemq.cloud';
        const port = 8884;
        const username = 'spyrobot';
        const password = 'MySecurePass123';
        const topicPrefix = 'spy_robot/robot1';
        const controlTopic = topicPrefix + '/control';
        const scheduleTopic = topicPrefix + '/patrol/schedule';
        const pathTopic = topicPrefix + '/patrol/path';

        // go2rtc settings – set this to your Pi's IP or hostname
        const GO2RTC_HOST = window.location.hostname || 'localhost';
        const GO2RTC_PORT = 1984;
        const GO2RTC_STREAM = 'picam';

        // ========== STATUS LOGGING ==========
        const statusDiv = document.getElementById('status');
        function log(msg) {
            console.log(msg);
            statusDiv.textContent += msg + '\n';
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }
        window.onerror = function(msg, url, line, col, error) {
            log('PAGE ERROR: ' + msg + ' at line ' + line);
        };

        // ========== MQTT (controls only, no video signaling) ==========
        log('Connecting to MQTT...');
        const client = mqtt.connect(`wss://${broker}:${port}/mqtt`, { username, password });

        client.on('connect', () => {
            log('MQTT connected');
            // Start go2rtc WebRTC connection once MQTT is up
            startGo2rtcStream();
        });

        client.on('error', (err) => log('MQTT error: ' + err.message));

        // ========== MOVEMENT ==========
        function sendCommand(cmd) { client.publish(controlTopic, cmd); }

        // ========== VIRTUAL JOYSTICK ==========
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left:'50%', top:'50%' },
            color: 'blue',
            size: 180
        });
        joystick.on('move', (evt, data) => {
            const dir = data.direction?.angle;
            if (dir === 'up') sendCommand('f');
            else if (dir === 'down') sendCommand('b');
            else if (dir === 'left') sendCommand('l');
            else if (dir === 'right') sendCommand('r');
        });
        joystick.on('end', () => sendCommand('s'));

        // ========== PATROL ==========
        function setSchedule() {
            const times = document.getElementById('patrolTimes').value.split(',').map(t=>t.trim());
            client.publish(scheduleTopic, JSON.stringify(times));
            log('Schedule set');
        }
        function loadWaypoints() {
            const wp = document.getElementById('waypoints').value;
            client.publish(pathTopic, wp);
            log('Waypoints loaded');
        }
        function startManualPatrol() {
            loadWaypoints();
            const now = new Date();
            now.setMinutes(now.getMinutes() + 1);
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            client.publish(scheduleTopic, JSON.stringify([`${hh}:${mm}`]));
            log('Patrol scheduled at ' + hh + ':' + mm);
        }

        // ========== go2rtc WebRTC ==========
        const videoElem = document.getElementById('video');
        let pc = null;

        async function startGo2rtcStream() {
            log('Connecting to go2rtc...');

            // Close any existing connection
            if (pc) {
                try { pc.close(); } catch(e) {}
                pc = null;
            }

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            // Receive remote video track
            pc.ontrack = (event) => {
                log('Track received: ' + event.track.kind);
                if (event.streams && event.streams[0]) {
                    videoElem.srcObject = event.streams[0];
                    videoElem.play().catch(e => log('Play error: ' + e.message));
                }
            };

            pc.oniceconnectionstatechange = () => {
                log('ICE state: ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                    log('Connection lost, reconnecting in 3s...');
                    setTimeout(startGo2rtcStream, 3000);
                }
            };

            // Create offer requesting video
            const offer = await pc.createOffer({
                offerToReceiveVideo: true,
                offerToReceiveAudio: true
            });
            await pc.setLocalDescription(offer);

            // Wait for ICE gathering to complete (or timeout)
            await new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    const checkState = () => {
                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icegatheringstatechange', checkState);
                            resolve();
                        }
                    };
                    pc.addEventListener('icegatheringstatechange', checkState);
                    // Timeout after 2s regardless
                    setTimeout(resolve, 2000);
                }
            });

            // Send offer to go2rtc API
            try {
                const apiUrl = `http://${GO2RTC_HOST}:${GO2RTC_PORT}/api/webrtc?src=${GO2RTC_STREAM}`;
                log('Sending offer to ' + apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'offer',
                        sdp: pc.localDescription.sdp
                    })
                });

                if (!response.ok) {
                    throw new Error(`go2rtc API returned ${response.status}`);
                }

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
                log('go2rtc stream connected');
            } catch (e) {
                log('go2rtc connection error: ' + e.message);
                log('Retrying in 5s...');
                setTimeout(startGo2rtcStream, 5000);
            }
        }
    </script>
</body>
</html>
